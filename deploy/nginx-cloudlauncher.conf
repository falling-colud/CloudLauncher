# Port 80 catch-all for requests that name no known host (for example the bare IP address).
# It must not proxy to the API: that would serve the whole API over plain HTTP. Certificate
# challenges still work; everything else is dropped.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        allow all;
    }

    location / {
        return 444;
    }
}
