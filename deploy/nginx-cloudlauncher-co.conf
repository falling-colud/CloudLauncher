# cloudlauncher.co: /etc/nginx/conf.d/cloudlauncher-co.conf
#
# cloudlauncher.co and www go through Cloudflare (proxied). api.cloudlauncher.co is DNS-only and
# comes straight here, because Cloudflare's free plan refuses request bodies over 100 MB and
# launchers upload files up to 256 MB.
#
# Certificates (issued while all three names were still DNS-only):
#   certbot certonly --webroot -w /usr/share/nginx/html --key-type ecdsa \
#     -d cloudlauncher.co -d www.cloudlauncher.co -d api.cloudlauncher.co \
#     --deploy-hook 'kill -HUP $(cat /run/nginx.pid)'
# Renewals keep working behind Cloudflare because the challenge path is served on :80 and :443.
#
# Reload with `sudo nginx -t && sudo kill -HUP $(cat /run/nginx.pid)`; `systemctl reload nginx`
# fails on this host.

# Website: cloudlauncher.co (www redirects to it).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cloudlauncher.co;

    # Cloudflare's addresses (https://www.cloudflare.com/ips/). Requests from them carry the real
    # client address in CF-Connecting-IP; everything else keeps its own address.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    ssl_certificate     /etc/letsencrypt/live/cloudlauncher.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloudlauncher.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 64m;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        allow all;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.cloudlauncher.co;

    ssl_certificate     /etc/letsencrypt/live/cloudlauncher.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloudlauncher.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        allow all;
    }

    location / {
        return 301 https://cloudlauncher.co$request_uri;
    }
}

# Launcher API: api.cloudlauncher.co (DNS-only, no Cloudflare in front).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.cloudlauncher.co;

    ssl_certificate     /etc/letsencrypt/live/cloudlauncher.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloudlauncher.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # The API's own limits are lower; this only has to let the largest upload through.
    client_max_body_size 300m;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        allow all;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# Plain HTTP: certificate challenges, everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name cloudlauncher.co www.cloudlauncher.co api.cloudlauncher.co;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
