# Installed as /etc/nginx/conf.d/cloudlauncher.conf.
# Certificate: certbot certonly --webroot -w /usr/share/nginx/html
#              -d launcher.crispythedev.duckdns.org --key-type ecdsa
#              --deploy-hook 'kill -HUP $(cat /run/nginx.pid)'
# `systemctl reload nginx` fails on this host (systemd cannot set up the unit's private /tmp
# namespace: "Failed at step NAMESPACE", status=226). Test with `sudo nginx -t`, then reload with
# `sudo kill -HUP $(cat /run/nginx.pid)`, as the certbot deploy hook does.
# The launcher API over HTTPS, so bearer tokens and users' CurseForge API keys are not sent in
# clear. Launchers before 1.3.0 call http://130.61.131.193:5000 directly, so port 5000 stays open
# for them.
server {
    server_name launcher.crispythedev.duckdns.org;

    # Pack blobs are uploaded whole; the API's own Kestrel limit is 200 MB.
    client_max_body_size 256m;

    # Let's Encrypt HTTP-01 challenges: served from disk, not proxied to the API (which would
    # 404 them). Needed because this server_name wins over the catch-all ACME vhost.
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        allow all;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;   # stream big blob uploads straight through
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    ssl_certificate     /etc/letsencrypt/live/launcher.crispythedev.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/launcher.crispythedev.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# Plain HTTP goes to HTTPS, except the ACME challenge path, which must stay reachable over :80.
server {
    listen 80;
    listen [::]:80;
    server_name launcher.crispythedev.duckdns.org;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
