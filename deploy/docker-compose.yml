services:
  postgres:
    image: postgres:17-alpine
    container_name: cloudlauncher-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cloudlauncher
      POSTGRES_USER: cloudlauncher
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudlauncher -d cloudlauncher"]
      interval: 10s
      timeout: 5s
      retries: 5
